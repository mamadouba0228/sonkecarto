# Publication GitHub Pages
#   branche main   -> version démo   (https://<owner>.github.io/sonkecarto/demo/)
#   branche stable -> version stable (https://<owner>.github.io/sonkecarto/)
name: Pages

on:
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Choisir le canal
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "name=demo" >> "$GITHUB_OUTPUT"
            echo "dest=demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bash scripts/build-pages.sh "${{ steps.channel.outputs.name }}" _site

      - name: Publier sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: ${{ steps.channel.outputs.dest }}
          keep_files: true
